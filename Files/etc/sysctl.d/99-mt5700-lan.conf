# MT5700 / H5000M —— LAN 侧二层互通
# 由固件 Files/etc/sysctl.d/ 提供，开机由 /etc/init.d/sysctl 加载。
# 回滚：删掉本文件后重启（或 sysctl -w 改回 0）。

# proxy_arp_pvlan：开启「私有 VLAN 代理 ARP」。
# 用途：MLO（多链路聚合）把同一台客户端的两个射频绑成一个逻辑链路后，
#   同网段内的 ARP 请求可能只落在一个射频上，另一个射频下的设备收不到，
#   表现为「手机连 WiFi 能拿到 IP，但访问同网段设备（NAS/投屏/另一台手机）不通」。
# 开后由路由器代答 ARP，跨射频/跨接口的同网段互访即可通。
#
# 只写 all 与 default：sysctl.d 在开机早期执行，br-lan 此时可能还没创建，
# 直接写具体接口名会报 "cannot stat"；之后新建的接口会继承 default 的值。
#
# 说明：不开 net.ipv4.conf.*.proxy_arp（普通代理 ARP）。
# 那个会让路由器对「任何能路由到的目标」代答 ARP，作用域会波及 WAN 口，
# 与本文件要解决的「同网段/MLO 跨射频互访」不是一回事，没必要引这个副作用。
net.ipv4.conf.all.proxy_arp_pvlan = 1
net.ipv4.conf.default.proxy_arp_pvlan = 1
