# MT5700 / H5000M 5G CPE —— TCP 与队列调优
# 由固件 Files/etc/sysctl.d/ 提供，开机由 /etc/init.d/sysctl 加载。
# 回滚：删掉本文件后执行 `sysctl -p /etc/sysctl.conf` 或重启。

# PMTUD 黑洞自愈：很多 5G 回传/隧道会静默丢 ICMP，表现为“小包正常、大包卡死”。
# 设为 1 后内核检测到疑似黑洞会启用 MTU 探测自动降 MSS（设 2 为始终探测，偏激进）。
net.ipv4.tcp_mtu_probing = 1

# 连接空闲后不再把拥塞窗口打回初始值（RFC 2861 默认行为对 CPE 是纯损失）。
# 网页连点、SSH 敲命令、游戏心跳都是“发一会儿停一会儿”，设 0 后交互明显跟手。
net.ipv4.tcp_slow_start_after_idle = 0

# 不复用旧连接的 RTT/cwnd 缓存：5G 链路 RTT 随信号与基站负载跳变，
# 10 分钟前的度量可能是错的。代价是短连接每次重新慢启动，属可接受取舍。
net.ipv4.tcp_no_metrics_save = 1

# 默认拥塞控制切到 BBR（kmod-tcp-bbr 已编入固件）。
# 若模块未加载，内核会自动回退到 cubic，不会导致启动失败。
net.ipv4.tcp_congestion_control = bbr

# 队列调度默认 fq（2026-09-22 由 fq_codel 改）。
#
# 为什么是 fq 而不是 fq_codel：本文件已把拥塞控制固定为 bbr，而 BBR 自身
# 就负责 pacing（按它估算的带宽匀速发包）。fq_codel 会在 BBR 之上再叠一层
# CoDel AQM —— 它靠「队列停留超时就丢包」来控延迟，这个丢包对 BBR 来说是
# 假信号，会让它误判链路拥塞而降速。fq 只做每流公平队列 + 把 pacing 交给
# BBR，正是 BBR 设计的配套 qdisc（内核文档 tcp-bbr 一节明确推荐 fq）。
# 实测基线固件（OpenWrt 25.12 官方 MT7987 方案）也是 net.core.default_qdisc=fq。
#
# 作用域提醒：这只是**默认** qdisc，只对没被别的机制接管的接口生效。
#   - 启用 SQM 的接口由 SQM 在该接口上覆盖为 cake，本项对它无效；
#   - 未启用 SQM 时（出厂默认 sqm.eth1.enabled=0）本项对 lan/wan 全生效。
# 回滚：改回 fq_codel 即可（若哪天把拥塞控制改成 cubic/cake，应改回 fq_codel）。
net.core.default_qdisc = fq

# ---- socket 缓冲上限（2026-09-22 补，对齐基线固件实测值） ----
# 5G 下 RTT 波动大（实测 20~80ms），带宽按 500Mbps 算，带宽时延积
# BDP ≈ 500Mb/s × 80ms ≈ 5MB。原来的 4M/8M 上限在高 BDP 时刻会**卡住窗口**，
# 表现为「测速前几秒冲得上去、随后被压平」。提到 16M 只是抬高天花板。
#
# 关键：这几项都只是**上限**，内核按每连接实际需求动态分配，不预分配内存，
# 空闲时不占资源；单连接最多用到 tcp_rmem/tcp_wmem 的第三个数。
# 基线固件（OpenWrt 25.12 / H5000M）实测值同为 16M。
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216

# ---- 以下三项为 2026-09-18 补入的低风险项（均可单独注释回滚） ----

# TCP Fast Open：客户端 + 服务端都开（3）。省掉一次 RTT 的握手往返，
# 对「点一下网页要等半天」的 5G 链路观感改善最明显。
# 前提是对端也支持；不支持时内核自动回退，不会连通性失败。
net.ipv4.tcp_fastopen = 3

# 监听队列长度：默认 128，路由器上跑 uhttpd / ttyd / 代理端口时偏小，
# 高并发（几十台设备同时建连）会丢 SYN。提到 1024 只是允许排队，不额外吃内存
# （每个槽位几十字节），配合防火墙已开的 synflood_protect 不构成放大面。
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 1024

# 反向路径过滤：这台机器是双出口（eth1 有线 WAN + MT5700M 5G），
# 非对称路由下 rp_filter=1 会把「从 5G 进、从有线回」的包当伪造直接丢掉，
# 症状是部分网站时通时不通。显式关掉，避免默认策略随版本漂移。
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.all.rp_filter = 0

# ---- 软件转发路径的收包积压与单轮预算（2026-09-22 补） ------------------
#
# 前提（都是本机已成立的事实，不是假设）：
#   ① 本机**必须**关闭 flow offload，否则 TTL 统一规则零命中（见
#      Files/etc/nftables.d/12-mangle-ttl-128.nft 里的实测记录）→ 转发全走软件路径；
#   ② 收包靠 RPS 分摊到四个核（见 /etc/init.d/mt5700-rps）；
#   ③ eth2（5G 模组）真机实测协商速率 **1280Mb/s**（ethtool 读回）。
#
# netdev_max_backlog 是**每 CPU** 的收包积压上限（内核默认 1000）。
# 1280Mb/s 按 1500B 满载算约 106kpps，RPS 分到四核后每核约 26kpps ——
# 1000 包只够缓冲约 38ms。5G 突发（基站调度、TCP 突发、某核被抢占）一旦超过它，
# 内核**直接丢包且不打任何日志**，表现为「测速忽高忽低、重传涨了却查不到原因」。
# 提到 5000（约 190ms 缓冲）代价极小：队列里存的是 skb 指针，不复制数据。
net.core.netdev_max_backlog = 5000

# netdev_budget：一次软中断轮次里最多处理多少包（默认 300）。
# RPS 把包分散到四核后，每核单轮 300 包就成了瓶颈 —— 包没处理完就被下一轮抢占，
# CPU 时间耗在反复进出软中断上。提到 600 让每轮多消化一倍。
# 不会无界占用 CPU：还有 netdev_budget_usecs 兜着，
# 超时照样让出，故单核不会被软中断长期霸占。
# ⚠️ 该值**别照抄内核文档**：文档与部分发行版写 2000μs，本机（6.18.52）实测
#    `sysctl net.core.netdev_budget_usecs` = **20000μs**。本文件不写它（保持系统值），
#    此处只是提醒：若将来要调，先 `sysctl` 读回真值再算，别拿 2000 当默认（2026-09-22）。
net.core.netdev_budget = 600
