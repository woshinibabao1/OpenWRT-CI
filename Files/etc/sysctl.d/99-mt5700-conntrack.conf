# MT5700 / H5000M —— 连接跟踪表容量
# 由固件 Files/etc/sysctl.d/ 提供，开机由 /etc/init.d/sysctl 加载。
# 回滚：删掉本文件后重启。

# 依据：厂家固件 Mwrt-H5000M-1139-24（/etc/sysctl.d/11-nf-conntrack.conf）实测值
#   nf_conntrack_max      = 100000   （本机默认 63488）
#   nf_conntrack_buckets  = 65536    （本机实测 63488，见下方说明，未改）
# 其余项两边本来就一致，未做改动：
#   nf_conntrack_checksum = 0        （省逐包校验和验证，两边都是 0）
#   nf_conntrack_tcp_timeout_established = 7440
#   nf_conntrack_acct     = 1

# 连接跟踪表上限提到厂家值。1GB 内存机型上每条连接约占 300 字节，
# 10 万条约 30MB 常驻 + 哈希表，实测可用内存 814MB，余量充足。
# 表满的症状是「部分网站打不开、新连接直接被丢」，且日志只报
# "nf_conntrack: table full, dropping packet" 一行，很容易误判成运营商问题。
net.netfilter.nf_conntrack_max = 100000

# 说明：buckets 本文件不改。
#   本机 6.18 实测 net.netfilter.nf_conntrack_buckets **可写**（sysctl -w 返回 0），
#   但写入会重建整个哈希表，开机阶段做既拖启动又会让已有连接抖一下；
#   63488 与厂家 65536 只差 3%，收益远小于代价，故维持默认。
#   确实要改时走模块参数更干净：/etc/modprobe.d/ 写
#   options nf_conntrack hashsize=65536 —— 模块加载时一次定好，不用重建。
#
# ★ 2026-09-22 更正：本文件早先写「本机默认即 65536，两边一致」是**错的**。
#   真机读回 nf_conntrack_buckets = 63488（= 0xF800），不是 65536。
#   来由：buckets 在 nf_conntrack 模块加载那一刻由当时的 conntrack_max 推导，
#   之后再 sysctl 抬高 conntrack_max **不会**让它重算 —— 63488 才是本机真实值。
#   结论不变（差 3%，不值得在开机阶段重建哈希表），但数字必须写准：
#   这里正是「拿错数字做判断」的高发处，而整段推理只依赖这一个数字成立。

# 已建立的 TCP 连接多久回收。7440 秒（124 分钟）是 OpenWrt 默认值，
# 与厂家一致，显式写出以防上游默认值漂移（曾有过改到 432000 的版本，
# 会让 CPE 在长时间挂机后表被长连接占满）。
net.netfilter.nf_conntrack_tcp_timeout_established = 7440

# expect 表上限。2026-09-21 补：本机实测 992，厂家 16384（差 16 倍）。
#   expect 表用于 NAT 环境下的**预测连接** —— FTP（数据通道）、SIP/VoIP、RTSP、
#   IRC DCC 等协议会先由 helper 登记一条 expect，等对端发起真实连接时匹配放行。
#   本机 992 的来由：内核按模块加载那一刻的 nf_conntrack_max 推导，而我们把
#   conntrack_max 提到 100000 是**之后**用 sysctl 改的，expect_max 不会跟着重算。
#   表满的症状是「FTP 能登录但列不出目录、VoIP 有信令没语音」，且默认无日志。
#   16384 是纯上限（不预分配内存），只有真用到才占，零风险对齐厂家值。
net.netfilter.nf_conntrack_expect_max = 16384

# 已核对、两边一致（未改）：nf_conntrack_udp_timeout=60 / udp_timeout_stream=180 /
#   acct=1 / checksum=0 / nf_conntrack_helper —— 本机
#   `/proc/sys/net/netfilter/nf_conntrack_helper` **不存在**（该内核未暴露此开关），
#   故厂家设的 helper=1 无法照搬，也不需要（我们不用依赖 helper 的协议）。

# ---- NAT 源端口段：与上面的 conntrack_max 配套（2026-09-22 补） ----------
#
# 内核默认 32768-60999，即**只有 28232 个源端口**可供 SNAT 使用。
# 一条出站连接占用一个源端口，所以单出口的并发 NAT 连接数实际上被这个区间
# 封顶 —— 上面把 nf_conntrack_max 提到 100000 之后，**瓶颈已经从表容量转移到
# 端口段**：不改这里，10 万只是账面上的数字，实际到 2.8 万条就不再建新连接，
# 症状是「表还没满，但新连接偶尔连不上」，日志里什么都看不到。
#
# 本机是单 5G 出口（eth2，CGNAT 段 100.76.8.240/8），所有客户端的出站连接
# 挤同一个端口池；几十台设备叠加手机后台长连，破万级很常见。
#
# 取 10240-65535（55296 个）：下限特意不用 1024 —— 避开「<1024 为特权端口」
# 的惯例认知，也避开部分中间盒对低源端口的过滤。
# 配套事实：本机 tcp_tw_reuse=2（仅对客户端连接复用 TIME_WAIT 端口），
# 有利于端口回收；范围放宽后回收压力同样被摊薄。
# 回滚：改回 32768 60999。
net.ipv4.ip_local_port_range = 10240 65535
