# 云编译公用核心（被 WRT-BUILD / H5000M-MT-AUTO 调用）
# 2026-09-18 收敛：只保留 Hiveton H5000M 一套产物
#   （H5000M-WIFI-YES + MT5700 + immortalwrt/master），
#   AP3000M / X86 的工作流、配置与专用脚本已删除。
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      # ---- 固件身份类默认值：集中在这里，调用方不必逐字重抄 ----
      # 2026-09-23 收敛：WRT_THEME / WRT_NAME / WRT_SSID / WRT_WORD / WRT_IP /
      # WRT_PW 这 6 项原本在 WRT-BUILD 与 H5000M-MT-AUTO 里**各抄一遍**（两处字面量
      # 完全相同）。抄两份的必然结果是改一处漏一处：「改了默认密码，手动编译变了、
      # 定时自动编译还是旧的」——而这类问题只会在刷完机、拿旧密码连不上时才暴露。
      # 现在只有**要覆盖默认值的调用方**才需要传；改默认值改这一处，两边同时生效。
      # （WRT_MARK 同理，它的 default 就在下面。）
      #
      # ⚠️ MT_MODE **不在此列**：它的默认必须是 ""（不装任何 MT 插件，保持普通 CI
      #    行为），而两个调用方都要 MT5700 —— 那是**有意的差异化**，不是重复，
      #    故仍由调用方显式传。把它的 default 改成 MT5700 会悄悄改变「不传」的语义。
      WRT_THEME:
        required: false
        type: string
        default: argon
      WRT_NAME:
        required: false
        type: string
        default: OWRT
      WRT_SSID:
        required: false
        type: string
        default: OWRT
      WRT_WORD:
        required: false
        type: string
        default: '12345678'
      WRT_IP:
        required: false
        type: string
        default: 192.168.10.1
      WRT_PW:
        required: false
        type: string
        default: '无'
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string
      # 固件版本尾缀标记：状态页显示 "<LuCI 版本> / <WRT_MARK>-<日期>"。
      # 默认 OWrt（原为仓库所属者名 woshinibabao1，用户要求改掉）。
      WRT_MARK:
        required: false
        type: string
        default: OWrt
      # MT 插件模式（独立配置层，全机型复用）：
      #   ""      —— 不安装任何 MT 插件（默认，保持普通 CI 行为）
      #   MT5700  —— 仅 luci-app-mt5700（方案 B，单包自含 Rust 后端）
      #   MT5700M —— ⛔ 已停用（方案 A：luci-app-mt5700m + QModem 的 sms-tool_q /
      #              ubus-at-daemon；sms-tool_q 版本号对 apk 非法且功能与方案 B 重复）。
      #              ApplyMTMode / VerifyMTMode 里保留该分支作为 **fail-fast 守卫**：
      #              误选会明确报错终止，不会静默编出没人验证过的固件。
      # 其他值在 ApplyMTMode / VerifyMTMode / Packages.sh 中报错并终止。
      MT_MODE:
        required: false
        type: string
        default: ""
      # Flow Offload 选型（独立配置层，全机型复用）：
      #   auto —— SQM 未启用时开软件卸载，启用时关（二者**真互斥**：被卸载的连接绕过 qdisc）
      #   off  —— 始终关闭
      #   on   —— 强制开软件卸载【默认】（SQM 启用时仍执行，但记一条警告：offload 会让 SQM 失效）
      #   on-hw —— 强制开软件 + 硬件卸载（本机 5G 出口是 USB CDC-NCM，PPE 只接 SoC 以太网口，
      #            硬件卸载实际不会命中；保留仅为将来 WAN 改走有线 eth1 时可用）
      # 非法值在编译期即 ::error:: + exit 1（见 Scripts/ApplyFlowOffload.sh），绝不带进固件。
      #
      # ★★ 2026-10-05 默认值由 off 改为 on。原注释引用的真机实证
      #   （2026-09-21：卸载开 → HTTP 25s 超时）**已作伪** —— 那次测试的流量根本没经过本机：
      #   开发机双网卡且有线优先（192.168.8.103 跃点 25 优先于 Wi-Fi 192.168.10.202 跃点 30），
      #   tracert 显示公网第一跳是另一台路由器的 192.168.8.1。
      #   改用「绑定源地址 + 查 conntrack 的 [OFFLOAD] 标记」重测（2026-10-05）：
      #     关 → OFFLOAD 标记 0
      #     开 → OFFLOAD 标记 42，3 条长连接全程正常，44.15 MB / 39s 全部收完，无超时无丢包
      #   ⇒ 软件卸载在本机确定生效且不断网。TTL 归一规则对快转包失效是真的
      #     （快转路径绕过整条 postrouting），但 flowtable 会自行递减 TTL（内核文档：
      #     decremented before calling neigh_xmit()），包照发不误 —— 「失效 ≠ 断网」。
      # 老调用方（WRT-BUILD / H5000M-MT-AUTO）不传也能跑（红线1）。
      WRT_FLOW_OFFLOAD:
        required: false
        type: string
        default: 'on'

# ★ 2026-09-28：移除 job 级 `GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}`。
#   原先它挂在 env 下，于是**本 job 的每一步**都能读到这个 contents: write 的令牌，包括：
#     · Custom Packages —— Packages.sh 会 clone 一批第三方插件仓库（它们的 Makefile 进构建树）
#     · Compile Firmware —— `make` 的 recipe 就是任意 shell，会执行上游与第三方包的 Makefile
#     · Initialization Environment —— 以 root 执行远端下载下来的初始化脚本
#   而它**没有任何使用者**：`Scripts/*.sh` 里 grep `TOKEN|secrets.` 为零；
#   Release 那一步用的 softprops/action-gh-release@v2，其 token 输入默认值就是
#   `${{ github.token }}`（其 action.yml 原文：“Defaults to github.token when omitted”），
#   并不依赖这个 env。整条链上唯一需要凭据的地方是 Release 步骤，改成在那里单独注入 ——
#   编译期执行的第三方代码从此看不到令牌。
env:
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_MARK: ${{inputs.WRT_MARK}}
  MT_MODE: ${{inputs.MT_MODE}}
  WRT_FLOW_OFFLOAD: ${{inputs.WRT_FLOW_OFFLOAD}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    # 防两次构建互踩：定时链（Auto-Clean → H5000M-MT-AUTO）与手动 WRT-BUILD 可能重叠，
    # 而两者共用同一套缓存 key（wrt-tc-$WRT_TARGET-$WRT_INFO-$WRT_BRANCH-$WRT_CACHE_WEEK）。
    # actions/cache 对已存在的 key 是**跳过保存**，后完成的那次白编；且 Tag 含日期，
    # 同一天会产出两个 Release（Auto-Clean 已跑完，不会再去清）。
    # cancel-in-progress: false = 后来者**排队**而非杀掉前一个 —— 编译到一半被杀最浪费机时。
    concurrency:
      group: wrt-build-${{inputs.WRT_CONFIG}}-${{inputs.MT_MODE}}
      cancel-in-progress: false
    # 略低于平台 6h 硬上限：被硬上限杀掉时 runner 直接终止，
    # 缓存的 post 保存步骤会被整段跳过，下次必然冷编译。
    timeout-minutes: 345
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          # 移除 runner 预置的 google-chrome apt 源：其镜像偶发哈希不一致
          # （File has unexpected size / Mirror sync in progress?），会导致
          # `apt update` 返回非零并中断整个初始化步骤。
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo -E apt -yqq update || sudo -E apt -yqq update
          # 不做 full-upgrade / autoremove：托管 runner 每次全量升级要数分钟，
          # 对 OpenWrt 编译零收益，属于纯耗时项
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev ccache
          # P15：原 `bash <(curl ...)` 在 curl 失败时喂空脚本给 bash → 退出 0 → 缺编译依赖，
          # 几小时后才以莫名其妙的编译错误暴露。改为先下载到文件、失败即终止（GHA run 以 bash -e 执行）。
          curl -fsSL --retry 5 --retry-all-errors https://build-scripts.immortalwrt.org/init_build_environment.sh -o /tmp/init_env.sh && sudo bash /tmp/init_env.sh
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          # 缓存滚动周期（ISO 年-周）：缓存 key 用它取代源码 commit hash。
          # 用 hash 时，上游每来一个新提交就多存一份内容几乎相同的缓存
          # （工具链 ~1GB + ccache 上限 5G，压缩后单份 1~2GB），几天就把 10GB 配额
          # 撑满 → GitHub 按 LRU 回收，最早的连同仍在用的那份一起被淘汰 → 缓存全失效，
          # 接着就是「冷编译 → 超时 → 没缓存 → 更冷」的死循环。按周滚动后每周最多一份。
          echo "WRT_CACHE_WEEK=$(TZ=UTC-8 date +"%G-W%V")" >> $GITHUB_ENV
          echo "WRT_MARK=${WRT_MARK:-${GITHUB_REPOSITORY%%/*}}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          # 分支名要进**文件名**与 **Release Tag**（`cp`/`mv` 的路径、git tag 名），
          # 而 BRANCH 在 WRT-BUILD 里是自由文本输入：填 `feature/x` 或 `refs/heads/master`
          # 会让 `cp .../Config-…-feature/x-….txt` 的父目录不存在 → 非零退出，
          # 而 run 是 `bash -e`，第 563 行就地失败、595 与 Release 都不会执行。
          # 这里另存一个 slug 供拼名用；真正的 clone 仍用原值（见 Clone Code 步骤）。
          echo "WRT_BRANCH_SLUG=$(printf '%s' "$WRT_BRANCH" | tr '/' '-')" >> $GITHUB_ENV
          # P09：grep 无匹配时 exit 1（文件缺失 exit 2），故必须 || true 吸收，
          # 否则在 bash -e 下赋值语句本身即触发 errexit，下面的 ::error:: 永远打不出来。
          WRT_TARGET_VAL="$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt || true)"
          # 取不到目标平台时后续全部静默错乱（缓存 key 退化、产物改名成一串横杠），
          # 故在最早能发现处直接失败，而不是带着空值跑完全程。
          [ -n "$WRT_TARGET_VAL" ] || { echo "::error::无法从 Config/$WRT_CONFIG.txt 解析 CONFIG_TARGET_*=y"; exit 1; }
          echo "WRT_TARGET=$WRT_TARGET_VAL" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV
          # MT 模式标签：用于产物文件名 / Release Tag / 配置导出，区分双配置并行编译
          if [ -z "${MT_MODE:-}" ]; then
            echo "WRT_MT=NONE" >> $GITHUB_ENV
          else
            echo "WRT_MT=$MT_MODE" >> $GITHUB_ENV
          fi
          echo "当前机型=${WRT_CONFIG} MT_MODE=${MT_MODE:-NONE}"

      - name: Clone Code
        run: |
          # 整条流水线的第二步，此前是裸奔的 git clone —— 一次瞬时抖动就让后面
          # 几小时的构建在第 2 步归零（上面的 curl 早就加了 --retry 5）。
          # 重试前必须先删残留目录，否则重试会因 "destination path already exists" 直接失败。
          for TRY in 1 2 3; do
            if git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/; then
              break
            fi
            echo "::warning::git clone 第 $TRY 次失败，15 秒后重试"
            rm -rf ./wrt/
            sleep 15
          done
          [ -d ./wrt/.git ] || { echo "::error::git clone 连续 3 次失败：$WRT_REPO@$WRT_BRANCH"; exit 1; }

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      # 关键改动 1：工具链 + ccache 合成一份缓存
      #   - 只缓存 staging_dir/host* 与 staging_dir/tool*：
      #     staging_dir/target-* 会被下一步的 `make clean` 删除
      #     （Makefile 中 _clean: rm -rf $(BUILD_DIR) $(STAGING_DIR) $(BIN_DIR)），
      #     打包上传它纯属浪费带宽，且随配置漂移污染缓存。
      #   - key 绑定 WRT_TARGET 而非 WRT_CONFIG：H5000M 与 AP3000M 同为
      #     mediatek/filogic，可共用同一份工具链，避免每天白编译一次。
      #   - key 不再把 commit hash 放在唯一位置上，配合 restore-keys 做前缀回退，
      #     上游一有新提交也能命中上次的工具链。
      #   - ★ 2026-09-21 重构：原先写 `save-always: true` 试图让「失败也保存」，但
      #     actions/cache@v4 的 action.yml 明确标注该输入
      #     "does not work as intended"（deprecation），其 post-if 仍是 success() ——
      #     即「失败也保存」**从未生效过**，恰好踩中下面注释担心的
      #     「失败 → 无缓存 → 再失败」死循环。
      #     现拆成 restore（本步骤）+ 显式 save（Compile Firmware 之后，if: always()）。
      #   - key 末尾原本是 WRT_HASH（源码提交），上游每天有新提交就多存一份内容几乎
      #     相同的缓存，几天撑满 10GB 配额后被 LRU 整批淘汰。改成 WRT_CACHE_WEEK（周）后
      #     每周最多一份；注意同 key 已存在时 save 步骤要靠 cache-hit 判断跳过，
      #     所以一周内缓存内容保持周初那次的结果 —— 这正是要的（工具链不变，条目不增殖）。
      - name: Check Caches (Toolchain & ccache)
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v4
        with:
          key: wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_CACHE_WEEK}}
          restore-keys: |
            wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      # 关键改动 2：dl 缓存按「源码 + 分支」共享
      #   下载的源码包与机型无关。原 key 带 WRT_CONFIG，H5000M / AP3000M / X86
      #   各存一份 2.1GB，三份就是 6.3GB，直接把 10GB 配额撑爆触发 LRU 淘汰，
      #   结果是所有缓存一起失效。共享后每个源码分支只存一份。
      #   （save-always → restore/save 拆分的理由见上一步骤注释）
      - name: Check Caches (Download)
        id: check-dl
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v4
        with:
          key: wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_CACHE_WEEK}}
          restore-keys: |
            wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-
          path: |
            ./wrt/dl

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            # 归一化时间戳 + tmp/.build 标记：让 OpenWrt 跳过工具链重建检查。
            # 源码（build_dir）本来就不在缓存里，包级增量由 ccache 与 make stamp 决定。
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          # 不再在 cache miss 时删除历史缓存：
          # 上面的 restore-keys 正是依赖历史缓存做前缀回退，删掉等于每次都冷启动。
          # 配额交给 GitHub LRU 自动回收，必要时用 Cache-Clean 手动清理。

      # feeds 缓存已移除：实测 `feeds update -a` 仅约 1 分钟，
      # 而缓存键绑定 commit hash 几乎必然 miss，多出的两次上传/下载是净亏损。

      - name: Update Feeds
        run: |
          cd ./wrt/

          # 与上面的 Clone Code 同一处理：feeds 要跑几十次 git 拉取
          #（网络操作量远大于单次 clone），原先却没有任何重试 ——
          # 一次瞬时抖动同样白烧前面十几分钟，加固标准不该两样。
          OK=0
          for TRY in 1 2 3; do
            if ./scripts/feeds update -a && ./scripts/feeds install -a; then OK=1; break; fi
            echo "::warning::feeds update/install 第 $TRY 次失败，15 秒后重试"
            sleep 15
          done
          [ "$OK" = "1" ] || { echo "::error::feeds update/install 连续 3 次失败"; exit 1; }

      - name: Custom Packages
        # ★ 2026-09-28：luci-app-mt5700 的源码在**私有**仓库里
        #   （woshinibabao1/MT5700-Console），匿名 HTTPS 克隆必然失败。
        #   Packages.sh 对需要它的那一次克隆改用只读 Deploy Key（见该文件顶部说明）。
        #   密钥**只注入这一步** —— 这一步会克隆一批第三方插件，而它们的 Makefile
        #   会进构建树、由后面的 Compile Firmware 执行；编译期跑的第三方代码
        #   不该看得到任何令牌（与本文件 2026-09-28 移除 job 级 GITHUB_TOKEN 同一理由）。
        #   Packages.sh 克隆完成即删除私钥文件（另有 trap 兜底），不留到下一步。
        env:
          MT5700_DEPLOY_KEY: ${{ secrets.MT5700_DEPLOY_KEY }}
        run: |
          cd ./wrt/package/

          # 统一用 `bash <file>` 调用：本仓 Scripts/*.sh 在 git 索引里是 100644（无 exec 位），
          # 能直接执行全靠上面 Check Scripts 那条 `find -maxdepth 3 ... -exec chmod +x`
          # 的副作用 —— 而它限深 3 层，将来若加了 Scripts/<子目录>/x.sh 就赋不到执行位，
          # 表现为「本地（Windows/MSYS 不看执行位）能跑、CI 报 Permission denied」。
          # `bash <file>` 不依赖文件自身的执行位，是这里唯一稳的调用方式。
          bash $GITHUB_WORKSPACE/Scripts/Packages.sh
          bash $GITHUB_WORKSPACE/Scripts/Handles.sh

      # ★ 2026-09-21 新增：Rust 产物缓存（MT5700 Console 后端）。
      # 为什么值得：luci-app-mt5700 的 src/Makefile 用 cargo 交叉编译
      # at-webserver-rust（tokio / serde / chrono / ureq 依赖树），此前每次构建
      # 都全量重编（数分钟）。缓存其 target 目录后，依赖 crate 的编译产物直接复用，
      # 只重编 at-webserver-rust 自身（源码变更那部分，约几十秒）。
      # 为什么必须放在 Custom Packages **之后** restore：target 目录在包内
      # （src/Makefile 把 CARGO_TARGET_DIR 写死为 $(CURDIR)/target），而包是
      # Packages.sh 里刚 git clone 出来的 —— 先 restore 会让克隆目标目录非空而失败。
      # 附带缓存 ~/.cargo/registry 与 ~/.cargo/git（依赖下载，省 30~60 秒）。
      # ~/.rustup **不缓存**：rustup 安装在 Packages.sh 里已完成，此处恢复已晚，
      # 且它体积大（~1GB）收益小（1~2 分钟安装）。
      # key 用 WRT_CACHE_WEEK（周）而非源码 hash：cargo 自身的增量机制（target 内
      # fingerprint）已能正确处理源码变化，key 只决定「是否跳过 save」—— 与工具链
      # 缓存同一哲学：每周第一跑保存，本周内条目不增殖。
      - name: Check Caches (Rust)
        id: cache-rust
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v4
        with:
          key: rust-mt5700-${{ env.WRT_CACHE_WEEK }}
          restore-keys: |
            rust-mt5700-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./wrt/package/luci-app-mt5700/src/target

      - name: Custom Settings
        run: |
          cd ./wrt/

          # DEPS_EXPECT：只有"叠加了 GENERAL.txt"的配置才该有下面那批常见依赖。
          # TEST 配置只叠机型配置、不叠 GENERAL，必须跳过断言，否则会整片误报。
          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config
            DEPS_EXPECT=0
          else
            cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config
            DEPS_EXPECT=1
          fi
          export DEPS_EXPECT

          # 显式启用 ccache：缓存落到 ./.ccache，与上面缓存的 path 对应。
          # 重复编译、仅改配置或插件时可大幅缩短耗时。
          echo "CONFIG_CCACHE=y" >> .config

          bash $GITHUB_WORKSPACE/Scripts/Settings.sh

          # MT 独立插件配置层：按 MT_MODE 叠加 MT5700 / MT5700M / 空（互斥）
          # 必须在 Settings.sh 之后、make defconfig 之前执行
          bash $GITHUB_WORKSPACE/Scripts/ApplyMTMode.sh

          # Flow Offload 选型（P01）：把 WRT_FLOW_OFFLOAD 写入固件 files 覆盖层
          # （wrt/files/etc/mt5700/flow-offload），开机由 uci-defaults 读取决策。
          # 必须在 make defconfig 之前执行（与 MT 配置层同属「配置前」阶段）。
          # ★ 用 bash 显式调用而不是直接执行：本仓 Scripts/*.sh 在 git 索引里是 100644
          # （无 exec 位），直接 $PATH 调用在 runner 上有 Permission denied 的风险，
          # `bash <file>` 不依赖文件自身的执行位。
          bash $GITHUB_WORKSPACE/Scripts/ApplyFlowOffload.sh

          make defconfig && make clean

          # 关键包选择自检：kconfig 对不存在的包会静默丢弃（不报错），
          # 所以光看“defconfig 成功”不能证明包名有效，这里把新增项打印出来核对。
          echo "===== 关键包选择自检（缺失即代表包名无效，会被静默丢弃）====="
          # irqbalance / luci-app-irqbalance 已于 2026-09-21 从配方移除（三个符号 =n），
          # 故不再列入本自检 —— 否则会打印出 =n 的行，看起来像"包还在"。
          grep -E '^CONFIG_PACKAGE_(kmod-sched-core|kmod-sched|kmod-sched-cake|kmod-sched-pie|kmod-sched-fq-pie|kmod-ifb|kmod-tcp-bbr|tc-full|ethtool|sqm-scripts|luci-app-sqm|zram-swap|luci-app-firewall|luci-app-mt5700|luci-app-mt5700m|sms-tool_q|ubus-at-daemon)=' .config || true
          echo "----- 目标与内核选项 -----"
          grep -E '^(CONFIG_TARGET_MULTI_PROFILE|CONFIG_TARGET_ALL_PROFILES|CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_hiveton_h5000m)=' .config || true
          grep -E '^CONFIG_(DEFAULT_TCP_CONG|TCP_CONG_BBR|KERNEL_TCP_CONG_BBR|KERNEL_NET_SCH_CAKE|KERNEL_NET_SCH_FQ)=' .config || true

          # 常见依赖断言（2026-09-22）：把 Config/GENERAL.txt 里 plugin-deps 标记区
          # （形如 `# >>> plugin-deps:begin` … `# >>> plugin-deps:end` 两行，awk 按整行匹配）
          # 之间的每个 CONFIG_PACKAGE_* 逐个断言必须真的进了最终 .config。
          # 起因：第三方插件报「依赖缺失 kmod-inet-diag」，而它必须随镜像编入
          # （kmod 的依赖串带内核 build 指纹，在线仓库的同名包与自编译内核对不上）。
          # ★ 为什么断言而不是只打印：kconfig 对不存在的包名是**静默丢弃**，
          #   「defconfig 成功」完全不能证明包名有效 —— 漏了就是又出一版
          #   「装插件时才发现缺依赖」的固件。
          # ★ 为什么从 Config 提取而不是在这里再抄一份清单：清单抄两份必然漂移
          #   （加包的人只改一处、断言永远是绿的），这里让断言跟着配置自动生长。
          # ★ 只有叠加了 GENERAL.txt 的配置才断言（见上面 DEPS_EXPECT）：
          #   TEST 配置不叠 GENERAL，若照断会整片误报。
          if [ "${DEPS_EXPECT:-0}" = "1" ]; then
            # ★ 标记必须锚到行尾：不加 `[[:space:]]*$` 时 `…:beginX` 也会被当成 begin，
            #   标记改名后这里照样提取成功 → 断言看似在跑，实际早就失效（与
            #   Scripts/SelfCheck.sh 的 C6 同一条 awk，两处必须一致）。
            DEPS_LIST="$(awk '/^# >>> plugin-deps:begin[[:space:]]*$/{f=1;next} /^# >>> plugin-deps:end[[:space:]]*$/{f=0} f && /^CONFIG_PACKAGE_/ {sub(/=.*/,""); sub(/^CONFIG_PACKAGE_/,""); print}' "$GITHUB_WORKSPACE/Config/GENERAL.txt")"
            DEPS_TOTAL="$(printf '%s\n' "$DEPS_LIST" | grep -c . || true)"
            DEPS_MISSING=""
            for dep in $DEPS_LIST; do
              grep -q "^CONFIG_PACKAGE_${dep}=y$" .config || DEPS_MISSING="$DEPS_MISSING $dep"
            done
            echo "常见依赖断言区：提取到 ${DEPS_TOTAL:-0} 个包"
            if [ -n "$DEPS_MISSING" ]; then
              echo "::error::以下常见依赖未进入 .config（包名被 kconfig 静默丢弃，或上游改名）：$DEPS_MISSING"
              exit 1
            fi
            # 标记被误删/改名时 awk 提取为空 —— 那种情况下上面是"零个包全过"，必须显式拦下。
            [ "${DEPS_TOTAL:-0}" -ge 10 ] || { echo "::error::通用配置里只提取到 ${DEPS_TOTAL:-0} 个常见依赖，plugin-deps 标记可能被改动"; exit 1; }
          else
            echo "常见依赖断言：本配置未叠加 GENERAL.txt，跳过"
          fi

          # R04（P03 收口）：luci-app-firewall 是「页面上改 flow offload」的前提（网络→防火墙→常规设置页）。
          # 这条不是 || true：包名无效（被 kconfig 静默丢弃）时 CI 必须红掉，而不是带着缺页的固件发版。
          grep -q '^CONFIG_PACKAGE_luci-app-firewall=y' .config || { echo "::error::luci-app-firewall 未进入 .config，「页面上改 flow offload」不可用"; exit 1; }

          # 设备选择断言：kconfig 对「依赖不满足的符号」是**静默丢弃**（不报错、不警告），
          # 所以 defconfig 成功 ≠ 设备选对。CONFIG_TARGET_DEVICE_* 位于
          # `menu "Target Devices" depends on TARGET_MULTI_PROFILE`，一旦那一行没生效，
          # 编译目标会退回平台默认 profile —— 编出别的机型的固件，而 CI 全程全绿。
          # 这里在 make defconfig 之后直接读最终 .config 校验，是最早能发现的位置。
          DEV_SELECTED="$(grep -cE '^CONFIG_TARGET_DEVICE_[A-Za-z0-9_]+=y' .config || true)"
          echo "已选设备条目数：${DEV_SELECTED:-0}"
          grep -E '^CONFIG_TARGET_DEVICE_[A-Za-z0-9_]+=y' .config || true
          [ "${DEV_SELECTED:-0}" -ge 1 ] || { echo "::error::.config 中没有任何 CONFIG_TARGET_DEVICE_*=y：设备选择被 kconfig 丢弃（多为 TARGET_MULTI_PROFILE 不是 y）"; exit 1; }
          if grep -qE '^CONFIG_TARGET_ALL_PROFILES=y' .config; then
            echo "::warning::CONFIG_TARGET_ALL_PROFILES=y，将编译该平台下全部设备的镜像（与单产物目标不符）"
          fi

      # 内核补丁注入：把本仓 Patches/*.patch 拷进 openwrt 的内核补丁队列。
      # ★ 本仓历史上没有任何打补丁动作（Custom Settings 只做 cat >> .config），
      #   所以这一段是新增能力。位置要求：
      #   - 必须在 make defconfig 之后：target/linux/mediatek 的补丁目录是内核包
      #     prepare 阶段展开的，过早复制会被 prepare 清掉；
      #   - 必须在 Compile Firmware 之前。
      # 出问题时可用 WRT_PATCHES=off 一键跳过，不必回滚提交。
      - name: Apply Kernel Patches
        run: |
          cd ./wrt/
          bash $GITHUB_WORKSPACE/Scripts/ApplyPatches.sh

      # 配置生成后、编译前：验证 MT 模式包选择互斥（双重验证之一）
      - name: Verify MT Mode
        run: |
          cd ./wrt/

          bash $GITHUB_WORKSPACE/Scripts/VerifyMTMode.sh

      # 配置生成后、编译前：断言未意外选中 sing-box / homeproxy（P05 双校验之一）
      - name: Verify No SingBox (pre)
        run: |
          cd ./wrt/

          PHASE=pre bash $GITHUB_WORKSPACE/Scripts/VerifyNoSingBox.sh

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 只在并行下载失败时才做串行兜底，不再每次都跑两遍全量校验
          make download -j$(nproc) || make download -j1

          # 清理下载失败的残留（借鉴 P3TERX 模板，沿用多年的做法）：
          #   抓取失败时 dl/ 里会留下几十~几百字节的 HTML 错误页/重定向页，
          #   make 看到"文件已存在"就跳过，等到编译阶段才报 checksum mismatch ——
          #   那时已经白烧了几小时，且失败点离根因很远，极难定位。
          #   先 ls 打印出来便于排查（保留证据），再删除。
          #   安全性：被误删的合法小文件，make 在需要时会自动重新下载，
          #   不会破坏构建；代价只是多抓一次几百字节。
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 指向被缓存的 .ccache 目录，限制容量并开启压缩，避免占满 10GB 配额
          export CCACHE_DIR="$(pwd)/.ccache"
          export CCACHE_MAXSIZE=5G
          export CCACHE_COMPRESS=true
          ccache -z 2>/dev/null || true

          # 关键改动 4：失败重试必须保持并行。
          #   原来的 `make -j$(nproc) || make -j1 V=s` 一旦偶发失败就退化成单线程，
          #   几小时的编译会直接拖过上限被取消。
          #   输出同时写入 build.log，失败时提取首个出错包并以 ::error:: 注解上报。
          #   必须关闭 errexit：GHA 的 run 以 bash -e 执行，开了 pipefail 后
          #   首次 make 失败会让整个步骤就地终止，重试与诊断分支永远不会执行。
          set +e -o pipefail

          make -j$(nproc) 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo "第一次编译失败（rc=$RC），保持并行重试并追加日志"
            make -j$(nproc) V=s 2>&1 | tee -a build.log
            RC=${PIPESTATUS[0]}
          fi

          if [ "$RC" -ne 0 ]; then
            echo "::group::编译失败诊断"
            grep -E "^(ERROR: |make(\\[[0-9]+\\])?: \*\*\* ).*(failed to build|Error [0-9]|too big)" build.log \
              | sort -u | head -n 10 | while IFS= read -r LINE; do echo "::error::$LINE"; done

            if ! grep -qE "^(ERROR: |make(\\[[0-9]+\\])?: \*\*\* )" build.log; then
              echo "::error::未匹配到包级错误行，输出日志末尾 30 行"
              tail -n 30 build.log
            else
              echo "--- 编译错误上下文（C/C++ / 链接 / 镜像）---"
              grep -nE "error:|Error [0-9]+|collect2:|undefined reference|too big" build.log | head -n 25
            fi
            echo "::endgroup::"
          fi

          ccache -s 2>/dev/null || true

          exit "$RC"

      # ★ 2026-09-21：显式 save 三份缓存（**编译失败也要保存**）。
      #   原先依赖 actions/cache@v4 的 post 阶段自动保存，但其 post-if 是 success()，
      #   「失败也保存」从未生效（save-always 已被官方标注为无效输入）——
      #   一旦编译失败，当次进展（ccache / 已编好的工具链 / Rust target）全部丢弃，
      #   下次从零开始，容易陷入「失败 → 无缓存 → 再失败」循环。
      #   每条 save 都带 cache-hit != 'true'：同 key 已存在时跳过（与原 post 行为一致，
      #   保证一周内条目不增殖）。
      #   ⚠️ 已知边界：runner 被 6h 硬上限**直接终止**时，这些步骤同样不会执行 ——
      #   该场景只能靠缩短编译时间规避（见上方 timeout-minutes 注释）。
      - name: Save Caches (Toolchain & ccache)
        if: always() && env.WRT_TEST != 'true' && steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_CACHE_WEEK}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Save Caches (Download)
        if: always() && env.WRT_TEST != 'true' && steps.check-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_CACHE_WEEK}}
          path: |
            ./wrt/dl

      - name: Save Caches (Rust)
        if: always() && env.WRT_TEST != 'true' && steps.cache-rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: rust-mt5700-${{ env.WRT_CACHE_WEEK }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./wrt/package/luci-app-mt5700/src/target

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          # 配置导出带 MT_MODE，便于双配置并行编译后区分
          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_MT"-"$WRT_INFO"-"$WRT_BRANCH_SLUG"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            # WRT_KVER 必须收敛为**一行**：每个 manifest 都会输出一行内核版本，
            # 产物里一旦出现第二个 manifest，多行值写进 $GITHUB_ENV 会以
            # "Invalid format" 让本步骤直接失败（旁边的 WRT_LIST 早就用 tr 收敛过）。
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -n 1)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            # P05（双校验之二）：编译后断言产物 manifest 不含 sing-box / homeproxy。
            # 必须在下面的 iregex 删除动作之前执行——该规则会清掉 packages 目录，
            # 但 *.manifest 保留，故此处仍可读到完整 manifest。
            PHASE=post bash $GITHUB_WORKSPACE/Scripts/VerifyNoSingBox.sh

            # P10：保留 sha256sums（仅几 KB），让用户能校验固件完整性；
            # packages/ 目录仍删（那是 ipk 仓库，不影响刷机）。
            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|packages\)$" -exec rm -rf {} +

            # ★ 用 while read 而不是 `for FILE in $(find ...)`：
            #   后者按空白分词，产物名一旦含空格（上游改文件名模板就可能）会被拆成
            #   两段，mv 报 "No such file" 且静默丢文件；while read 按行读不受影响。
            while IFS= read -r FILE; do
              EXT=$(basename "$FILE" | cut -d '.' -f 2-)
              # P09：grep 无匹配 exit 1，须 || true 吸收，否则 bash -e 下 errexit 让诊断打不出来。
              NAME=$(basename "$FILE" | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*" || true)
              # R06：NAME 为空时回退 basename 并告警，不 exit——避免 `CONFIG_VERSION_FILENAMES=y`
              # 等正常构建（文件名里无 WRT_TARGET 串）被误杀；只有 WRT_TARGET 那条才硬失败。
              if [ -z "$NAME" ]; then
                NAME="$(basename "$FILE" | cut -d '.' -f 1)"
                echo "::warning::产物改名未匹配到 WRT_TARGET=$WRT_TARGET，回退用 basename: $NAME"
              fi
              # 文件名嵌入 MT_MODE：同一机型的 MT5700 / MT5700M 产物可并存于同一 Release
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH_SLUG"-"$WRT_MT"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f "$FILE" "./upload/$NEW_FILE"
            done < <(find ./bin/targets/ -type f -iname "*$WRT_TARGET*")

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
            # 2026-09-23 移除：这里原本还有一句 `make clean -j$(nproc)`。
            #   ① 无收益 —— 产物在上面两行已全部 mv 进 ./upload/，剩下的 build_dir /
            #      bin/targets 空壳也不再被任何后续步骤读取（下一步就是上传 Release）；
            #   ② 有代价 —— 删几十 GB 的小文件要跑一两分钟，纯属浪费机时；
            #   ③ 是误导 —— clean 是 rm -rf，`-j$(nproc)` 对它没有任何作用，
            #      看着像并行清理，实际串行，容易让人误以为它很快。
            #   缓存保存步骤在更前面（Save Caches），删它不影响任何缓存。
          fi

      # ★ TEST=true 的用途是「只校验配置」，但它导出的 .config 原先只被 `cp` 进
      #   runner 本地的 ./wrt/upload/（= /mnt/build_wrt，随 runner 一起销毁）——
      #   全仓 grep `artifact` 零命中，用户在 Actions 页面上**拿不到那个文件**，
      #   与 WRT-BUILD 里「仅生成配置文件」的措辞不符（跑完了却取不到 = 白跑）。
      #   这里在 TEST 模式下把导出物作为 artifact 上传，让「跑一次 TEST 拿配置」成立；
      #   非 TEST 走下面的 Release，不重复上传。
      - name: Upload Config (TEST only)
        if: env.WRT_TEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Config-${{env.WRT_CONFIG}}-${{env.WRT_MT}}-${{env.WRT_BRANCH_SLUG}}-${{env.WRT_DATE}}
          path: ./wrt/upload/*.txt
          if-no-files-found: error

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@v2
        # 只有这一步需要凭据（建 tag + 发 Release）。原先它来自 job 级 env，
        # 那会让上面的编译步骤也拿到同一个 contents: write 令牌，见文件头 env 段的说明。
        # action 自身默认就取 `${{ github.token }}`，这里显式写出来是为了让
        # 「凭据只出现在需要它的地方」在 diff 里可见。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag 嵌入 MT_MODE，双配置并行编译时 Tag 可读且互不覆盖
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_MT}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH_SLUG}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            本 Release 只含 **Hiveton H5000M** 一个设备的固件（单 profile 编译，无需挑机型）。

            ## 加速现状

            - **软件 flow offload（`nf_flow_table`）：默认开启。**
              2026-10-05 真机 A/B 实测：开启后 conntrack 条目带 `[OFFLOAD]` 标记，
              3 条长连接全程正常，44.15 MB / 39s 全部收完，无超时无丢包。
              这是本机型**唯一确定拿得到**的加速（对所有接口生效，含 USB 5G WAN）。
              代价：WAN 出口的 TTL 归一规则（postrouting）对已建立的快转包不再生效 ——
              这是**取舍不是故障**，快转路径会自行递减 TTL，包照发不误。
              需要保留 TTL 归一时把 `FLOW_OFFLOAD` 选 `off`。
            - **硬件卸载（`flow_offloading_hw`）：默认关闭。**
              内核能力其实在 —— dmesg 有 `eth0/eth1: mediatek frame engine at 0xffffffc081880000, irq 67`，
              PPE 引擎已 attach。但 `mtk_ppe_offload.c` 的 `mtk_flow_set_output_device()`
              只接受 mtk_soc_eth 自己的 netdev[0..2]（映射 PSE_GDM1/2/3_PORT），
              其它设备一律 `return -EOPNOTSUPP` 且无 fallback；而 5G WAN 是 eth2（USB CDC-NCM）
              ⇒ 每条 flow 都会被拒，命中率 ≈ 0。
              ⚠️ **别被 fw4 静默通过骗了**：它的能力探测 `nft_try_hw_offload()` 只做 `nft -c`
              纯语法检查，而本机（无 PPE 时）`flags offload` 同样 rc=0 ⇒ 恒为假阳性，
              不会报 `falling back`。判真在用只能看 `/sys/kernel/debug/ppe0/entries` 增长
              + `ppe0/bind` 非空 + CPU 下降，三条同时成立。
              若将来 WAN 改走有线 `eth1`（现配置里有但未插线），`on-hw` 才有意义。

            完整取舍与实测过程见仓库 `FIRMWARE_OPTIMIZATION_REPORT.md`。

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            MT模式：${{env.WRT_MT}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
