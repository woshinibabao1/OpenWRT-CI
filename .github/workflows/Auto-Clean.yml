name: Auto-Clean

on:
  # 自动清理：每天 UTC 21:00（北京时间次日 05:00）
  schedule:
    - cron: 0 21 * * *
  # 手动清理
  workflow_dispatch:
    inputs:
      keep_latest_per_device:
        description: '保留每个机型最新一个 Release（不勾选则清除全部文件。定时触发时此项无效，一律按保留处理）'
        type: boolean
        default: false

# 最小权限：本工作流只做两件事 —— 删 Release 与 tag（contents）、删 workflow runs（actions）。
#
# ★ 原先写的是 `permissions: write-all`，而本仓 Guard-Check.yml 用的是 `contents: read` ——
#   同仓两个工作流一个最小、一个全开，属「同一原则只落实了一半」。
#   write-all 会让 GITHUB_TOKEN 同时具备改 issues / pull-requests / packages /
#   deployments / discussions 的能力，而这些能力本工作流一条都用不到；
#   一旦哪一步把 token 泄进日志、或喂给不可信输入，危害面就被无谓地放大。
permissions:
  contents: write   # 删 Release（同时删关联 tag）、删 git/refs/tags/*
  actions: write    # 删 workflow runs

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Clear Releases (delete all files / keep latest optional)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          # 手动触发且勾选 keep_latest_per_device 时仅保留每个机型最新一个。
          #
          # ★ 定时触发（schedule）时 inputs 全为空，若按"空=不保留"处理就会把 Release 全删光，
          #   而紧随其后的构建要 3~6 小时 —— 这段时间仓库里一个固件都没有，想刷回上一版
          #   都做不到，与本项目"稳定优先"的原则相悖。
          #   故定时场景一律按 keep-latest 处理：每个机型至少留最新一个，直到新固件发布出来。
          if [ "${{ github.event_name }}" = "schedule" ]; then
            KEEP_LATEST="true"
          else
            KEEP_LATEST="${{ inputs.keep_latest_per_device }}"
          fi
          PER_PAGE=100
          DELETED=0
          FAILED=0

          echo ">>> 开始处理 Releases（KEEP_LATEST=${KEEP_LATEST}）"

          # 1. 分页拉取全部非草稿 Release，按 published_at 降序暂存到临时文件
          ALL=$(mktemp)
          PAGE=1
          while :; do
            DATA=$(gh api "repos/${REPO}/releases?per_page=${PER_PAGE}&page=${PAGE}" \
              --jq '[.[] | select(.draft==false)] | sort_by(.published_at) | reverse | .[] | "\(.id)\t\(.tag_name)"')
            [ -z "${DATA}" ] && break
            printf '%s\n' "${DATA}" >> "${ALL}"
            PAGE=$((PAGE + 1))
          done

          TOTAL=$(wc -l < "${ALL}")
          echo "Total non-draft releases: ${TOTAL}"

          # 2. 若开启 keep_latest，计算每个机型需保留的最新 Release id（机型名 = tag 中 -immortalwrt- 之前的部分）
          KEEP_IDS=""
          if [ "${KEEP_LATEST}" = "true" ]; then
            # ALL 已按 published_at 降序排列，awk 保留每个机型首次出现的（即最新）Release id
            KEEP_IDS=$(awk -F'\t' '{split($2,a,"-immortalwrt-"); print a[1]"\t"$1}' "${ALL}" \
              | awk -F'\t' '!seen[$1]++{print $2}')
            echo "Keep-latest mode: keeping $(echo "${KEEP_IDS}" | wc -w | tr -d ' ') release(s)."
          fi

          # 3. 遍历并删除（keep_latest 模式下跳过需保留的）
          while IFS=$'\t' read -r RID RTAG; do
            [ -z "${RID}" ] && continue

            if [ "${KEEP_LATEST}" = "true" ] && echo "${KEEP_IDS}" | grep -qx "${RID}"; then
              echo "  [keep] ${RTAG} (id=${RID})"
              continue
            fi

            echo "  [delete] ${RTAG} (id=${RID})"
            # ★ 计数必须跟着**实际结果**走。原先两句删除都带 `|| true`，紧跟着
            #   无条件 `DELETED+1` —— 删除失败也会被计进成功数，末尾那句
            #   「deleted N old release(s)」于是会撒谎（本仓另一处的同类教训：
            #   界面显示的值与真实值不一致 = 界面在说谎）。
            #   改用 if 判定后，`set -e` 下同样不会因单条失败而中断整轮清理。
            if gh api "repos/${REPO}/releases/${RID}" -X DELETE --silent; then
              # 二次确认：手动删除残留 tag（部分情况下 tag 不会随 release 自动删除）
              gh api "repos/${REPO}/git/refs/tags/${RTAG}" -X DELETE --silent 2>/dev/null || true
              DELETED=$((DELETED + 1))
            else
              echo "  [warn] 删除 ${RTAG} (id=${RID}) 失败，未计入统计"
              FAILED=$((FAILED + 1))
            fi
          done < "${ALL}"

          rm -f "${ALL}"

          # ★ 一次都没删成功时必须以失败收场：H5000M-MT-AUTO 的闸门是
          #   `workflow_run.conclusion == 'success'`，而那个文件 43-48 行的注释
          #   自己点名的场景正是「清理失败（如 GitHub API 限流）」——
          #   若这里静默返回 0，几小时的编译照常启动，Release 页上残留的旧固件
          #   很快又会被下一次清理删掉，等于白烧机时。
          #   判据用「尝试删过、但一条都没成功」，而不是「DELETED == 0」：
          #   keep-latest 模式下本来就可能一条都不删（全部保留），那是正常结果。
          if [ "${FAILED}" -gt 0 ] && [ "${DELETED}" -eq 0 ]; then
            echo "::error::尝试删除 release 但一条都没成功（失败 ${FAILED} 条），按失败收场以拦住下游几小时的编译"
            exit 1
          fi
          [ "${FAILED}" -eq 0 ] || echo "::warning::有 ${FAILED} 条 release 删除失败（其余已处理）"

          if [ "${KEEP_LATEST}" = "true" ]; then
            echo "=== Done: deleted ${DELETED} old release(s), kept $(echo "${KEEP_IDS}" | wc -w | tr -d ' ') latest ==="
          else
            echo "=== Done: deleted ${DELETED} release(s), Releases 已清空 ==="
          fi

      - name: Clean old workflow runs (keep 30 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CUTOFF_DATE=$(date -d '30 days ago' +%Y-%m-%d)
          echo "Deleting workflow runs older than ${CUTOFF_DATE}..."

          WORKFLOWS=$(gh api "repos/${{ github.repository }}/actions/workflows" --jq '.workflows[].id')

          for WF_ID in ${WORKFLOWS}; do
            OLD_RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/${WF_ID}/runs?per_page=100&status=completed" \
              --jq ".workflow_runs | map(select(.created_at < \"${CUTOFF_DATE}\")) | .[].id")

            for RUN_ID in ${OLD_RUNS}; do
              echo "  Deleting run ${RUN_ID}..."
              gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" -X DELETE --silent || true
            done
          done

          echo "=== Workflow cleanup done ==="
