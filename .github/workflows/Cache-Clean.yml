name: Cache-Clean

on:
  # 不再每周定时全量清空：
  #   每周一 04:00（CST）执行一次 `gh cache delete --all`，会让本周第一次编译
  #   必然冷启动（实测 211.8 分钟，是正常耗时的 4~5 倍）。
  #   GitHub 会按 LRU 自动回收超配额缓存，需要彻底清理时手动触发本工作流即可。
  workflow_dispatch:

# 最小权限：本工作流只调 `gh cache delete --all`（Actions 缓存 API），
# 因此只需要 actions: write。原先的 `write-all` 与 Guard-Check.yml 的
# `contents: read` 形成同仓两种口径 —— 同一原则只落实了一半。
permissions:
  actions: write

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Cache Clean
        run: gh cache delete --all
