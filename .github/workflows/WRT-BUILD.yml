# 手动编译入口（机型 × MT 模式 二选一；产物/Tag 嵌入 MT 模式）
name: WRT-BUILD

on:
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置'
        default: 'H5000M-WIFI-YES'
        required: true
        type: choice
        options:
          - H5000M-WIFI-YES
      SOURCE:
        description: '源码仓库'
        default: 'immortalwrt/immortalwrt'
        required: true
        type: choice
        options:
          - immortalwrt/immortalwrt
      BRANCH:
        description: '源码分支'
        default: 'master'
        required: true
        type: string
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string
      MT_MODE:
        description: 'MT 插件模式'
        default: 'MT5700'
        required: true
        type: choice
        options:
          - MT5700
      FLOW_OFFLOAD:
        description: 'Flow Offload 选型（默认 off：开卸载会让固件的 TTL 统一规则失效）'
        default: 'off'
        required: false
        type: choice
        options:
          - auto
          - off
          - on
          - on-hw
      TEST:
        description: '仅生成配置文件，不编译固件。'
        # 2026-09-19 改为默认 false：手动触发本工作流的意图通常就是要出固件，
        # 默认的 true 只会生成 .config，容易让人以为「跑完了但没产物」。
        # 只想校验配置时手动勾选 true 即可。
        default: 'false'
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: ${{inputs.CONFIG}}-${{inputs.MT_MODE}}
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{inputs.CONFIG}}
      # 主题 / 版本尾缀 / 主机名 / SSID / 密码 / 管理地址走 WRT-CORE 的 inputs.default，
      # 这里只传本入口真正会变的值 —— 重复抄一遍只会让「改默认值」变成两处改动。
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      WRT_BRANCH: ${{inputs.BRANCH}}
      WRT_SOURCE: ${{inputs.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
      # Flow Offload 选型透传（默认 off，与 H5000M-MT-AUTO 的 workflow_run 路径行为一致；
      # 开卸载会让固件的 TTL 统一规则失效，详见 WRT-CORE 的 input 注释）
      WRT_FLOW_OFFLOAD: ${{inputs.FLOW_OFFLOAD}}
      # 唯一保留的 MT 模式：MT5700（woshinibabao1/MT5700-Console 单包方案）。
      # MT5700M 已停用（依赖 sms-tool_q 版本号对 apk 非法，且功能重复）。
      MT_MODE: MT5700
