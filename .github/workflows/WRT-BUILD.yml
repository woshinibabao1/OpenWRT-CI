# 手动编译入口（机型 × MT 模式 二选一；产物/Tag 嵌入 MT 模式）
name: WRT-BUILD

on:
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置'
        default: 'H5000M-WIFI-YES'
        required: true
        type: choice
        options:
          - H5000M-WIFI-YES
      SOURCE:
        description: '源码仓库'
        default: 'immortalwrt/immortalwrt'
        required: true
        type: choice
        options:
          - immortalwrt/immortalwrt
      BRANCH:
        description: '源码分支'
        default: 'master'
        required: true
        type: string
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string
      MT_MODE:
        description: 'MT 插件模式'
        default: 'MT5700'
        required: true
        type: choice
        options:
          - MT5700
      TEST:
        description: '仅生成配置文件，不编译固件。'
        default: 'true'
        required: true
        type: boolean

permissions: write-all

jobs:
  build:
    name: ${{inputs.CONFIG}}-${{inputs.MT_MODE}}
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{inputs.CONFIG}}
      WRT_THEME: argon
      WRT_MARK: OWrt
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      WRT_BRANCH: ${{inputs.BRANCH}}
      WRT_SOURCE: ${{inputs.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
      # 唯一保留的 MT 模式：MT5700（woshinibabao1/MT5700-Console 单包方案）。
      # MT5700M 已停用（依赖 sms-tool_q 版本号对 apk 非法，且功能重复）。
      MT_MODE: MT5700
