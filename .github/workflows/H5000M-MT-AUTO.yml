# 定时自动编译：Auto-Clean 清理完成后构建 H5000M 的 MT5700 配置
# （原 H5000M-AUTO，重命名并改为 MT5700 / MT5700M 双矩阵并行；
#   2026-09-15 起只保留 MT5700 —— 只出 H5000M-WIFI-YES-MT5700-immortalwrt-master 这一套产物）
#   MT5700 —— luci-app-mt5700（woshinibabao1/MT5700-Console，单包自含 Rust 后端）
#   （MT5700M 方案已停用：其依赖 sms-tool_q 版本号 "3.4.0-rc.3" 对 apk 非法，
#     会让整个 world 打包失败；且它与 MT5700 Console 功能重复）
# 产物文件名与 Release Tag 均嵌入 MT 模式，可并存区分。
name: H5000M-MT-AUTO

on:
  # Auto-Clean 完成后自动触发
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  # 也可手动触发
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}-${{ matrix.MT_MODE }}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [H5000M-WIFI-YES]
        SOURCE: [immortalwrt/immortalwrt]
        BRANCH: [master]
        # 只编译 MT5700（woshinibabao1/MT5700-Console）。
        # 不再并行 MT5700M：其依赖 sms-tool_q 的版本号对 apk 非法会导致 world 打包失败，
        # 且双套产物会让 Release 体积翻倍、编译机时翻倍。
        MT_MODE: [MT5700]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}

      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无

      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}

      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: 'false'
      MT_MODE: ${{ matrix.MT_MODE }}
